---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Bulk Merge PRs"

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: Dry Run
        type: boolean
        default: false
        required: false
      ignoreMergeErrors:
        description: Ignore Merge Errors
        type: boolean
        default: false
        required: false
      labels:
        description: Labels
        default: "any"
        required: false

permissions: {}

jobs:
  bulk-merge-prs:
    name: Bulk Merge PRs
    #runs-on: home-ops-runner
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'gznzeus' }}
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          app-id: "${{ secrets.BOT_APP_ID }}"
          private-key: "${{ secrets.BOT_APP_PRIVATE_KEY }}"

      - name: Merge
        shell: bash
        env:
          GITHUB_TOKEN: "${{ steps.app-token.outputs.token }}"
          GH_REPO: "${{ github.repository }}"
          DRY_RUN: "${{ inputs.dryRun }}"
          IGNORE_MERGE_ERRORS: "${{ inputs.ignoreMergeErrors }}"
          LABELS: "${{ inputs.labels }}"
        run: |
          args=()
          args+=(--state open)
          args+=(--limit 500)
          # gh only honours the last --search flag, so all exclusions go in one query
          args+=(--search "-label:hold -label:hold/upstream -label:type/major")
          if [ "${LABELS}" != "any" ]; then
              IFS=',' read -ra labels <<< "${LABELS}"
              for label in "${labels[@]}"; do
                  args+=(--label "${label}")
              done
          fi

          while IFS=$'\t' read -r id title; do
              [ -n "${id}" ] || continue
              echo "Processing PR #${id}: ${title}"

              if [ "${DRY_RUN}" = "true" ]; then
                  echo "Dry run: gh pr merge ${id} --squash"
                  continue
              fi

              if ! gh pr merge "${id}" --squash; then
                  if [ "${IGNORE_MERGE_ERRORS}" = "true" ]; then
                      echo "Merge failed for PR #${id}, continuing because ignoreMergeErrors=true."
                      sleep 2
                      continue
                  fi

                  echo "Merge failed for PR #${id}, stopping workflow."
                  exit 1
              fi

              sleep 2
          done < <(gh pr list "${args[@]}" --json number,title --jq 'sort_by(.number) | .[] | "\(.number)\t\(.title)"')
