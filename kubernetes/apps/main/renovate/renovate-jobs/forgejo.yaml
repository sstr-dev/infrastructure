---
# yaml-language-server: $schema=https://schemas.sstr.dev/renovate-operator.mogenius.com/renovatejob_v1alpha1.json
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: forgejo
spec:
  # autodiscover only covers repos the bot user can access
  discoveryFilters:
    - sstr-dev/*
  # node resolver instead of CoreDNS: with ndots:5 the node search domain
  # k8s.main.internal is tried first, and the upstream answers
  # code.sstr.dev.k8s.main.internal with NOERROR/no records instead of
  # NXDOMAIN, so the lookup fails (Renovate reports "Authentication failure").
  # Renovate only needs external names.
  dnsPolicy: Default
  extraEnv:
    - name: LOG_LEVEL
      value: info
    # renovate.json proposed in onboarding PRs; the shared preset lives on
    # Forgejo (local> = same platform as this job) and must be readable by
    # the bot user (team "bots")
    - name: RENOVATE_ONBOARDING_CONFIG
      value: >-
        {
          "$schema": "https://docs.renovatebot.com/renovate-schema.json",
          "extends": ["local>sstr-dev/renovate-config"]
        }
  image: ghcr.io/renovatebot/renovate:45.3.2
  parallelism: 3
  provider:
    name: forgejo
    endpoint: https://${SECRET_FORGEJO_HOSTNAME}/api/v1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi
  scratchVolume:
    enabled: true
    ephemeral:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
          storageClassName: local-hostpath
  schedule: 0 * * * *
  secretRef: renovate-forgejo-secret
