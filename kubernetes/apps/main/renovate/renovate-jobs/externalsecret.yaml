---
# yaml-language-server: $schema=https://schemas.sstr.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-forgejo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: renovate-forgejo-secret
    template:
      data:
        # access token of the Forgejo bot user "renovate"
        RENOVATE_TOKEN: "{{ .RENOVATE_FORGEJO_TOKEN }}"
        # read-only GitHub PAT: changelogs + github-releases/tags datasources
        RENOVATE_GITHUB_COM_TOKEN: "{{ .RENOVATE_GITHUB_COM_TOKEN }}"
  dataFrom:
    - extract:
        key: ${CLUSTER}/renovate-operator
