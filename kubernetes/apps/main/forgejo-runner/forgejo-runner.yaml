---
# yaml-language-server: $schema=https://schemas.sstr.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app forgejo-runner
spec:
  interval: 15m
  path: ./kubernetes/apps/base/forgejo-runner/forgejo-runner
  postBuild:
    substitute:
      APP: *app
      CLUSTER: ${CLUSTER}
    substituteFrom:
      - kind: Secret
        name: ns-forgejo-runner-secret
  dependsOn:
    - name: forgejo
      namespace: dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
