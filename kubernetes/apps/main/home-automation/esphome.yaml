---
# yaml-language-server: $schema=https://schemas.sstr.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app esphome
spec:
  interval: 1h
  path: ./kubernetes/apps/base/home-automation/esphome
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
  postBuild:
    substitute:
      APP: *app
      CLUSTER: ${CLUSTER}
      LB_SERVICE_IP: 10.0.69.54
      LB_SERVICE_SEGMENT: services
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  wait: true

