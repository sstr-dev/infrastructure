---
# yaml-language-server: $schema=https://schemas.sstr.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: democratic-csi
spec:
  interval: 1h
  path: ./kubernetes/apps/base/storage/democratic-csi
  prune: true
  postBuild:
    substitute:
      STORAGE_PATH: /var/mnt/extra/democratic-csi
      DEMOCRATIC_CSI_DRIVERNAME: democratic-csi.cluster.local
      DEMOCRATIC_STORAGECLASS: democratic-csi-hostpath
      DEMOCRATIC_SNAPSHOTCLASS: csi-democratic-csi-hostpath
      DEMOCRATIC_SNAPSHOTDEFAULT: '"true"'
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
