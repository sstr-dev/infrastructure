---
# yaml-language-server: $schema=https://schemas.sstr.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack
spec:
  path: ./kubernetes/apps/${CLUSTER}/observability/kube-prometheus-stack
  postBuild:
    substitute:
      APP: kube-prometheus-stack
      GATUS_SUBDOMAIN: prometheus
      ALERTMANAGER_SUBDOMAIN: alertmanager
      PROMETHEUS_SUBDOMAIN: prometheus
      PVC_CAPACITY: "20"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 1h
