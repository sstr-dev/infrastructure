---
# yaml-language-server: $schema=https://schemas.sstr.dev/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: litellm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
      app.kubernetes.io/instance: litellm
      app.kubernetes.io/managed-by: litellm-operator
  podMetricsEndpoints:
    - port: http
      path: /metrics/
      interval: 30s
