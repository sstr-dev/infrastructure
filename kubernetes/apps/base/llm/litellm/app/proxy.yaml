---
# yaml-language-server: $schema=https://schemas.sstr.dev/litellm.home-operations.com/litellmproxy_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  image: ghcr.io/berriai/litellm:${LITELLM_VERSION}
  replicas: 1
  # Models stay GitOps-managed (rendered into config.yaml).
  # apiAccess is still needed for the LiteLLMVirtualKey resources.
  applyMode: file
  apiAccess:
    masterKeyRef:
      name: litellm
      key: LITELLM_MASTER_KEY
  env:
    - name: LITELLM_MODE
      value: PRODUCTION
    - name: LITELLM_LOG
      value: INFO
    # use the model cost map bundled in the image instead of fetching it from GitHub
    - name: LITELLM_LOCAL_MODEL_COST_MAP
      value: "True"
  envFrom:
    - secretRef:
        name: litellm
  podAnnotations:
    reloader.stakater.com/auto: "true"
  generalSettings:
    master_key: os.environ/LITELLM_MASTER_KEY
    database_url: os.environ/DATABASE_URL
    store_model_in_db: false
    disable_adding_master_key_hash_to_db: true
  litellmSettings:
    # /metrics/ scraped by podmonitor.yaml (cluster-internal only); litellm_settings key, not general_settings
    require_auth_for_metrics_endpoint: false
    drop_params: true
    request_timeout: 600
    num_retries: 2
    json_logs: true
    # Response cache in Dragonfly (components/cache/dragonfly -> Service ${APP}-dragonfly)
    cache: true
    cache_params:
      type: redis
      host: ${APP}-dragonfly
      port: 6379
      ttl: 3600
  routerSettings:
    routing_strategy: simple-shuffle
    # shared rpm/tpm/parallel-request counters (needed once replicas > 1)
    redis_host: ${APP}-dragonfly
    redis_port: 6379
  callbacks:
    success: [prometheus]
    failure: [prometheus]
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  # Startup runs Prisma DB migrations and can take a few minutes
  livenessProbe:
    httpGet:
      path: /health/liveliness
      port: 4000
    initialDelaySeconds: 180
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    httpGet:
      path: /health/readiness
      port: 4000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
  service:
    port: 4000
  route:
    hostnames:
      - litellm.${SECRET_MAIN_DOMAIN_NAME}
    parentRefs:
      - name: ${GATEWAY:=envoy-internal}
        namespace: network
        sectionName: https
  resources:
    requests:
      cpu: 50m
      memory: 1Gi
    limits:
      memory: 2Gi
