---
# yaml-language-server: $schema=https://schemas.sstr.dev/litellm.home-operations.com/litellmproxy_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  image: ghcr.io/berriai/litellm:${LITELLM_VERSION}
  replicas: 1
  # Models stay GitOps-managed (rendered into config.yaml).
  # apiAccess is still needed for the LiteLLMVirtualKey resources.
  applyMode: file
  apiAccess:
    masterKeyRef:
      name: litellm
      key: LITELLM_MASTER_KEY
  env:
    - name: LITELLM_MODE
      value: PRODUCTION
    - name: LITELLM_LOG
      value: INFO
    # use the model cost map bundled in the image instead of fetching it from GitHub
    - name: LITELLM_LOCAL_MODEL_COST_MAP
      value: "True"
    # --- Authentik SSO (UI login). Client id/secret come from the litellm secret.
    # Redirect URI in authentik: https://litellm.${SECRET_MAIN_DOMAIN_NAME}/sso/callback
    # Free tier: SSO for up to 5 users.
    - name: PROXY_BASE_URL
      value: https://litellm.${SECRET_MAIN_DOMAIN_NAME}
    # browser redirect -> public URL
    - name: GENERIC_AUTHORIZATION_ENDPOINT
      value: https://${SECRET_SSO_DOMAIN}/application/o/authorize/
    # server-to-server -> in-cluster service (the SSO domain does not resolve inside the cluster)
    - name: GENERIC_TOKEN_ENDPOINT
      value: http://authentik-server.security.svc.cluster.local/application/o/token/
    - name: GENERIC_USERINFO_ENDPOINT
      value: http://authentik-server.security.svc.cluster.local/application/o/userinfo/
    - name: GENERIC_SCOPE
      value: openid email profile
    - name: GENERIC_USER_ID_ATTRIBUTE
      value: preferred_username
    - name: GENERIC_USER_EMAIL_ATTRIBUTE
      value: email
    - name: GENERIC_USER_DISPLAY_NAME_ATTRIBUTE
      value: name
    # authentik group -> LiteLLM role (groups claim is part of the default "profile" scope mapping)
    - name: GENERIC_ROLE_MAPPINGS_GROUP_CLAIM
      value: groups
    - name: GENERIC_ROLE_MAPPINGS_ROLES
      value: "{'proxy_admin': ['homelab-admins'], 'internal_user': ['litellm-users']}"
    - name: GENERIC_ROLE_MAPPINGS_DEFAULT_ROLE
      value: internal_user_viewer
  envFrom:
    - secretRef:
        name: litellm
  podAnnotations:
    reloader.stakater.com/auto: "true"
  generalSettings:
    # SSO is the only Admin UI login; the master key no longer works as the UI password but still authenticates API calls.
    disable_env_credential_login: true
    master_key: os.environ/LITELLM_MASTER_KEY
    database_url: os.environ/DATABASE_URL
    store_model_in_db: false
    disable_adding_master_key_hash_to_db: true
    use_x_forwarded_for: true
    # Envoy gateway pods sit in the pod CIDR; trusting them lets the Admin UI login throttle key on the real client address from X-Forwarded-For.
    trusted_proxy_ranges:
      - 10.42.0.0/16
  litellmSettings:
    # /metrics/ scraped by podmonitor.yaml (cluster-internal only); litellm_settings key, not general_settings
    require_auth_for_metrics_endpoint: false
    drop_params: true
    request_timeout: 600
    num_retries: 2
    json_logs: true
    # Response cache in Dragonfly (components/cache/dragonfly -> Service ${APP}-dragonfly)
    cache: true
    cache_params:
      type: redis
      host: ${APP}-dragonfly
      port: 6379
      ttl: 3600
      #type: qdrant-semantic
      #qdrant_collection_name: litellm_semantic_cache
      #qdrant_semantic_cache_embedding_model: local-embed
      #qdrant_semantic_cache_vector_size: 768   # nomic-embed-text Dimension
      #qdrant_quantization_config: binary
      #similarity_threshold: 0.8
  routerSettings:
    routing_strategy: simple-shuffle
    # shared rpm/tpm/parallel-request counters (needed once replicas > 1)
    redis_host: ${APP}-dragonfly
    redis_port: 6379
    # workstation (ws-*) is not always on -> fall back to the always-on Jetson
    fallbacks:
      - ws-qwen3.8-27b: [ws-qwen3.5-9b, qwen3-4b]
      - ws-qwen3.5-9b: [qwen3-4b]
      - ws-qwen2.5-coder-7b: [qwen3-4b]
    # skip an unreachable backend quickly instead of waiting for every request to time out
    allowed_fails: 1
    cooldown_time: 60
  callbacks:
    success: [prometheus]
    failure: [prometheus]
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  # Startup runs Prisma DB migrations and can take a few minutes
  livenessProbe:
    httpGet:
      path: /health/liveliness
      port: 4000
    initialDelaySeconds: 180
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    httpGet:
      path: /health/readiness
      port: 4000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
  service:
    port: 4000
  route:
    hostnames:
      - litellm.${SECRET_MAIN_DOMAIN_NAME}
    parentRefs:
      - name: ${GATEWAY:=envoy-internal}
        namespace: network
        sectionName: https
  resources:
    requests:
      cpu: 50m
      memory: 1Gi
    limits:
      memory: 2Gi
