---
# yaml-language-server: $schema=https://schemas.sstr.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name litellm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Admin key, must start with "sk-", create with openssl rand -hex 32
        LITELLM_MASTER_KEY: "{{ .LITELLM_MASTER_KEY }}"
        # Encrypts provider credentials stored in the DB. Never change it after the first start. Create with openssl rand -hex 32
        LITELLM_SALT_KEY: "{{ .LITELLM_SALT_KEY }}"
        # Shared CNPG cluster (database namespace). Create the DB and user first.
        DATABASE_URL: "postgresql://{{ .LITELLM_POSTGRES_USER }}:{{ .LITELLM_POSTGRES_PASSWORD }}@{{ .LITELLM_POSTGRES_HOST }}:{{ .LITELLM_POSTGRES_PORT }}/{{ .LITELLM_POSTGRES_DB }}"
        # Cloud provider keys (optional, used by models/ via apiKeyRef)
        #ANTHROPIC_API_KEY: "{{ .ANTHROPIC_API_KEY }}"
        #OPENAI_API_KEY: "{{ .OPENAI_API_KEY }}"
  dataFrom:
    - extract:
        key: ${CLUSTER}/litellm
