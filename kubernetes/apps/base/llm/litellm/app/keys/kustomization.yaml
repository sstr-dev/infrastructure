---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# One key per consumer, each bound to a team (teams/). The operator writes the
# key into Secret litellm-key-<app>; dev keys are additionally pushed to Vault.
resources:
  # team home
  - ./open-webui.yaml
  - ./paperless-gpt.yaml
  - ./paperless-ai.yaml
  # team dev
  - ./continue.yaml
  # team ops
  - ./opencode.yaml
  - ./lmstudio.yaml
  # home-assistant
  - ./home-assistant.yaml
