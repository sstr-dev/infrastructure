---
# OpenCode: agent/coding
# yaml-language-server: $schema=https://schemas.sstr.dev/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: opencode
spec:
  proxyRef: litellm
  teamID: ops
  keyAlias: opencode
  secretName: litellm-key-opencode
  secretKey: OPENAI_API_KEY
  metadata:
    app: opencode
  models:
    - ws-qwen3.8-27b
    - ws-qwen3.5-9b
    - local-chat
  # MCP toolsets (UUIDs from the LiteLLM UI, see README "Toolsets"). Capped by the team;
  # MCP servers not covered by these toolsets are not reachable with this key.
  mcpToolsets:
    - d5aaa841-2445-4855-8b20-a84544f7556a # research
    - ee1c96f1-d1ef-4c0a-810b-f63d0bf7fe7a # cluster-read
    - 1e46e758-3d43-4294-b9af-620632b5f71a # flux-operate
---
# Copy to Vault for use outside the cluster: vault kv get -field=key kv/shared/main/litellm/opencode
# yaml-language-server: $schema=https://schemas.sstr.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: ${CLUSTER}-litellm-key-opencode
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - name: vault-backend
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-opencode
  data:
    - match:
        secretKey: OPENAI_API_KEY
        remoteRef:
          remoteKey: shared/${CLUSTER}/litellm/opencode
          property: key
