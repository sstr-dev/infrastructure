---
# yaml-language-server: $schema=https://schemas.sstr.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name home-assistant-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Home Assistant (external). URL like https://hass.example.com,
        # long-lived token of a dedicated HA user (Profile -> Security).
        HOMEASSISTANT_URL: "{{ .LITELLM_HASS_URL }}"
        HOMEASSISTANT_TOKEN: "{{ .LITELLM_HASS_TOKEN }}"
  dataFrom:
    - extract:
        key: ${CLUSTER}/litellm
