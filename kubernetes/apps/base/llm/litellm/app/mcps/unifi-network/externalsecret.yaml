---
# yaml-language-server: $schema=https://schemas.sstr.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name unifi-network-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Dedicated local read-only UniFi account. Host is a bare IP/hostname, no https://
        UNIFI_NETWORK_HOST: '{{ .LITELLM_UNIFI_NETWORK_HOST }}'
        UNIFI_NETWORK_USERNAME: "{{ .LITELLM_UNIFI_NETWORK_USERNAME }}"
        UNIFI_NETWORK_PASSWORD: "{{ .LITELLM_UNIFI_NETWORK_PASSWORD }}"
  dataFrom:
    - extract:
        key: ${CLUSTER}/litellm
