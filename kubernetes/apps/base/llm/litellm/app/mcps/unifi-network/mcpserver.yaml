---
# UniFi Network (clients, devices, WLANs, firewall, stats).
# https://github.com/sirkirby/unifi-mcp/blob/main/apps/network/docs/configuration.md
# Read-only twice over: no UNIFI_POLICY_NETWORK_* gates are set (all mutations
# denied) and the dedicated local account should have the read-only role.
# yaml-language-server: $schema=https://schemas.sstr.dev/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: unifi-network-mcp
spec:
  alias: unifi_network
  proxyRef: litellm
  transport: http
  # Pinned: otherwise LiteLLM hashes name|url|transport|auth|alias into the id, and any
  # edit silently orphans toolsets / grants that reference it.
  params:
    server_id: unifi_network
  workload:
    # renovate: datasource=docker depName=ghcr.io/sirkirby/unifi-network-mcp
    image: ghcr.io/sirkirby/unifi-network-mcp:0.45.0@sha256:5c14d804e23b714850b58c4b45b722aeed9159d0acf47b182a3bfa92d2d17e7c
    env:
      - name: UNIFI_MCP_HTTP_ENABLED
        value: "true"
      - name: UNIFI_MCP_HTTP_TRANSPORT
        value: streamable-http
      - name: UNIFI_MCP_HOST
        value: "0.0.0.0"
      - name: UNIFI_MCP_PORT
        value: "3000"
      - name: TZ
        value: ${CLUSTER_TIMEZONE}
      # Dedicated local account on the gateway
      - name: UNIFI_NETWORK_HOST
        valueFrom:
          secretKeyRef:
            name: unifi-network-mcp
            key: UNIFI_NETWORK_HOST
      - name: UNIFI_NETWORK_USERNAME
        valueFrom:
          secretKeyRef:
            name: unifi-network-mcp
            key: UNIFI_NETWORK_USERNAME
      - name: UNIFI_NETWORK_PASSWORD
        valueFrom:
          secretKeyRef:
            name: unifi-network-mcp
            key: UNIFI_NETWORK_PASSWORD
      - name: UNIFI_SITE
        value: default
      - name: UNIFI_PORT
        value: "443"
      - name: UNIFI_MCP_ALLOWED_HOSTS
        value: unifi-network-mcp,unifi-network-mcp:3000,unifi-network-mcp.llm.svc.cluster.local,unifi-network-mcp.llm.svc.cluster.local:3000,localhost,localhost:3000,127.0.0.1,127.0.0.1:3000
      - name: UNIFI_MCP_ENABLE_DNS_REBINDING_PROTECTION
        value: "false"
      - name: UNIFI_TOOL_PERMISSION_MODE
        value: confirm
      - name: UNIFI_TOOL_REGISTRATION_MODE
        value: lazy
      # self-signed controller cert
      - name: UNIFI_VERIFY_SSL
        value: "false"
    port: 3000
    path: /mcp
    automountServiceAccountToken: false
    podAnnotations:
      reloader.stakater.com/auto: "true"
      # egress.cilium.io/unifi: "true"
    volumes:
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: tmp
        mountPath: /tmp
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 512Mi
    replicas: 1
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
