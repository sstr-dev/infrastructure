---
# Reliable tool calls on Ollama (qwen2.5:7b in local-chat returns empty tool
# calls since Ollama 0.40): paperless-ngx AI suggestions (tool_choice=required).
# yaml-language-server: $schema=https://schemas.sstr.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: qwen3-4b
spec:
  proxyRef: litellm
  modelName: qwen3-4b
  params:
    model: ollama_chat/qwen3:4b-instruct
    apiBase: http://vision-01.main.internal:11434
    additional:
      num_ctx: 8192 # matches PAPERLESS_AI_LLM_CONTEXT_SIZE, Ollama would truncate silently otherwise
  info:
    mode: chat
    maxInputTokens: 8192
    supportsFunctionCalling: true
