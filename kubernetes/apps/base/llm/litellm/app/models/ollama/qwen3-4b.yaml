---
# Kept loaded for Home Assistant -> default text model, so other apps
# don't force Ollama to swap models.
# yaml-language-server: $schema=https://schemas.sstr.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: qwen3-4b
spec:
  proxyRef: litellm
  modelName: qwen3-4b
  params:
    model: ollama_chat/qwen3:4b-instruct
    apiBase: http://vision-01.main.internal:11434
  info:
    mode: chat
    maxInputTokens: 8192
    supportsFunctionCalling: true
