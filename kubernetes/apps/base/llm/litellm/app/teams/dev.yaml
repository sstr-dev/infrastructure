---
# Interactive coding on the workstation (Continue): chat/edit/embeddings.
# No infra MCP servers here, those live in team ops (agents only).
# local-chat / local-embed are the fallback targets when the workstation is off
# (proxy.yaml routerSettings.fallbacks), so the team must allow them.
# yaml-language-server: $schema=https://schemas.sstr.dev/litellm.home-operations.com/litellmteam_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMTeam
metadata:
  name: dev
spec:
  proxyRef: litellm
  alias: dev
  models:
    - ws-qwen3.8-27b
    - ws-qwen3.5-9b
    - ws-qwen2.5-coder-7b
    - ws-nomic-embed-text
    - ws-lfm3-1.7b
    # fallbacks (always-on)
    - local-chat
    - local-fast # fallback for ws-lfm3-1.7b
    - local-embed # same nomic-embed-text -> vectors stay compatible
    # - claude-sonnet   # once models/anthropic is enabled
  # Ceiling for MCP; keys narrow it with mcpToolsets (see teams/kustomization.yaml)
  mcpServers:
    - searxng
    - kubesearch # public home-ops HelmRelease search, no cluster access
  # Local models cost 0; this caps cloud spend once cloud models are added
  maxBudget: "20"
  budgetDuration: 30d
  metadata:
    description: Interactive coding tools on the workstation
