---
# yaml-language-server: $schema=https://schemas.sstr.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: esphome
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: esphome-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # App
        ESPHOME_USERNAME: "{{ .ESPHOME_USERNAME }}"
        ESPHOME_PASSWORD: "{{ .ESPHOME_PASSWORD }}"
  dataFrom:
    - extract:
        key: ${CLUSTER}/esphome
