---
# yaml-language-server: $schema=https://schemas.sstr.dev/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: nas
spec:
  allowedNamespaces:
    all: true
  backend:
    filesystem:
      path: /repo
      volume:
        nfs:
          server: nas.main.internal
          path: /mnt/user/main-backup/kopiur
  credentialProjection:
    allowed: true
  encryption:
    passwordSecretRef:
      name: kopiur-nas
      namespace: &namespace kopiur-system
      key: KOPIA_PASSWORD
  identityDefaults:
    hostnameExpr: namespace
    usernameExpr: policyName
  #moverDefaults:
  #  resources:
  #    requests:
  #      cpu: 150m
  #      memory: 1Gi
  #    limits:
  #      memory: 2Gi
  scheduleDefaults:
    timezone: ${CLUSTER_TIMEZONE}
---
