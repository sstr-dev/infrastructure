---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${KOPIUR_CLAIM:-${APP}}
  labels:
    # dataSourceRef is immutable on bound claims: never patch existing PVCs,
    # only create missing ones (new apps / disaster recovery)
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  accessModes:
    - ${KOPIUR_ACCESSMODES:=ReadWriteOnce}
  dataSourceRef:
    # todo switch on bootstrap
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: ${APP}
    #dataSourceRef:
    #apiGroup: volsync.backube
    #kind: ReplicationDestination
    #name: ${APP}-dst
  resources:
    requests:
      storage: ${KOPIUR_CAPACITY:=5Gi}
  storageClassName: ${KOPIUR_STORAGECLASS:=longhorn}
