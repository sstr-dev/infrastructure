---
# yaml-language-server: $schema=https://schemas.sstr.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name kopiur-nas
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: *name
    template:
      data:
        KOPIA_PASSWORD: '{{ .KOPIA_PASSWORD }}'
  dataFrom:
    - extract:
        key: ${CLUSTER}/kopiur
---
